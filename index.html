<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tentacle gate 网址清单</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #8a8a8a;
    --line: #e6e6e6;
    --hover: #f2f6ff;
    --accent: #2b6cff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e8e8;
      --muted: #7d7d7d;
      --line: #2a2d33;
      --hover: #1e2430;
      --accent: #6f9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 64px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { margin-bottom: 28px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; letter-spacing: .2px; }
  #meta { margin: 0; color: var(--muted); font-size: 12px; }
  section { margin-bottom: 26px; }
  h2 {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  h2 span { font-weight: 400; letter-spacing: 0; text-transform: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 4px; }
  .plain { display: flex; flex-direction: column; gap: 2px; }
  a {
    display: block;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--fg);
    text-decoration: none;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .plain a { border: 0; padding: 3px 0; color: var(--accent); }
  a:hover { background: var(--hover); border-color: var(--accent); }
  .plain a:hover { background: none; text-decoration: underline; }
  #err { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>tentacle gate 网址清单</h1>
    <p id="meta">加载中…</p>
  </header>
  <main id="list"></main>
</div>

<script>
  // 从 URL 推导分组、显示标签与本站镜像路径；清单顺序原样保留
  // 镜像路径 = 原链接去掉 https://api.ai-pie.com/s/ 与查询串，即本站对应后缀
  function parse(url) {
    var link = url.replace("https://api.ai-pie.com/s/", "").split("?")[0] + "/";
    var m = url.match(/\/gate\/tentacle\/id\/([lh])\/(\d+)$/);
    if (m) return { group: "id / " + m[1], label: m[2], link: link };
    return { group: "控制接口", label: url.replace("https://api.ai-pie.com/s/", ""), link: link };
  }

  function render(urls) {
    var list = document.getElementById("list");
    var current = null, section = null, container = null, count = 0;

    urls.forEach(function (url) {
      var info = parse(url);
      if (info.group !== current) {
        current = info.group;
        section = document.createElement("section");
        var h2 = document.createElement("h2");
        h2.appendChild(document.createTextNode(info.group));
        container = document.createElement("div");
        container.className = info.group === "控制接口" ? "plain" : "grid";
        section.appendChild(h2);
        section.appendChild(container);
        list.appendChild(section);
      }
      var a = document.createElement("a");
      a.href = info.link;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = info.label;
      a.title = url + "  →  " + info.link;
      container.appendChild(a);
      count++;
      if (section && container.childElementCount === 1) {
        var span = document.createElement("span");
        span.dataset.group = info.group;
        section.querySelector("h2").appendChild(span);
      }
    });

    // 回填每组数量
    list.querySelectorAll("section").forEach(function (sec) {
      var n = sec.querySelector(".grid, .plain").childElementCount;
      var span = sec.querySelector("h2 span");
      if (span) span.textContent = n + " 条";
    });

    document.getElementById("meta").textContent =
      "共 " + count + " 条 · 本站为 api.ai-pie.com/s 的静态镜像（去掉 /s/ 前缀）";
  }

  fetch("urls.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      document.getElementById("meta").innerHTML =
        '<span id="err">urls.json 加载失败（' + e.message +
        '）。直接用文件打开会被浏览器拦截 fetch，请用本地服务器预览，或部署到 GitHub Pages 后再看。</span>';
    });
</script>
</body>
</html>
